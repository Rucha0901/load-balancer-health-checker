spec_version: "0.1.0"
name: load-balancer-health-checker
version: 1.0.0
description: Nginx/haproxy health check cadence optimization, flapping backend detection, and graceful connection draining.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - unhealthy-node-drain-control
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devops
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/load-balancer-health-checker"
